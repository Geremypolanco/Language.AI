version: '3.8'

services:
  # Ollama - LLM Backend
  ollama:
    image: ollama/ollama:latest
    container_name: language-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Cache & Session
  redis:
    image: redis:7-alpine
    container_name: language-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: language-ai-backend
    ports:
      - "8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
      - LINGUA_PORT=8100
      - LINGUA_DB_PATH=/app/data/lingua.db
      - LINGUA_CACHE_DIR=/app/data/media_cache
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: language-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8100
    depends_on:
      - backend
    volumes:
      - ./frontend/client/src:/app/client/src

volumes:
  ollama_data:
  redis_data:

networks:
  default:
    name: language-ai-network
