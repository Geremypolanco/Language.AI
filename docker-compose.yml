version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
      - LINGUA_PORT=8100
      - LINGUA_DB_PATH=/app/data/lingua.db
      - LINGUA_CACHE_DIR=/app/data/media_cache
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
