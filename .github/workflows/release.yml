name: Release

# Triggered by pushing a version tag (v1.2.3). Reuses the tests and build
# workflows instead of re-implementing them — a release is not exempt from
# the same gates every PR has to pass, it just also happens to publish an
# artifact. There is no package registry or hosting target wired up yet, so
# "release" here means: prove the tag is green, then attach the client's
# production build to a GitHub Release so it's a durable, downloadable
# artifact for that version.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  publish-release:
    name: Publish GitHub Release
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist
      - name: Package the client build
        run: |
          cd client-dist
          zip -r ../language-ai-client-${{ github.ref_name }}.zip .
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: language-ai-client-${{ github.ref_name }}.zip
          generate_release_notes: true
