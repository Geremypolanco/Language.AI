name: Deploy to Fly.io

# Only deploys once CI has actually passed for the commit — mirrors ARIA's
# own deploy gate (workflow_run keyed off CI's conclusion, not a raw push).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      strategy:
        description: Deploy strategy
        required: false
        default: rolling
        type: choice
        options: [rolling, bluegreen, immediate]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FLY_APP: lingua-ai-coach
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINGUA_SESSION_SECRET: ${{ secrets.LINGUA_SESSION_SECRET }}
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("$1=$2"); fi; }
          add HF_TOKEN "$HF_TOKEN"
          add GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          add GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          add LINGUA_SESSION_SECRET "$LINGUA_SESSION_SECRET"
          if [ ${#args[@]} -gt 0 ]; then
            flyctl secrets set "${args[@]}" --app "$FLY_APP"
          else
            echo "No GitHub-provided secrets to sync (Fly-set values left intact)."
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --remote-only \
            --strategy "${{ github.event.inputs.strategy || 'rolling' }}" \
            --wait-timeout 300

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "https://$FLY_APP.fly.dev/api/health" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','fail'))" 2>/dev/null || echo "fail")
            if [ "$STATUS" = "ok" ]; then
              echo "Health check PASSED (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed — waiting 10s..."
            sleep 10
          done
          echo "Health check FAILED after 5 attempts"
          exit 1
